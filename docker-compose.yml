# Local development stack. For now just Postgres; the API and frontend are run
# directly (uv / npm) during early development and can be containerized later.

services:
  db:
    image: postgres:16-alpine
    container_name: aiboc-db
    # Come back up with Docker itself. Without this the container stays down
    # after a Docker or machine restart, and the API only fails later, when a
    # request first touches the database.
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiboc
      POSTGRES_PASSWORD: aiboc
      POSTGRES_DB: aiboc
    ports:
      # Host port is configurable to avoid clashing with a local Postgres
      # already bound to 5432. Override via POSTGRES_HOST_PORT in a root .env.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - aiboc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiboc -d aiboc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aiboc_pgdata:
