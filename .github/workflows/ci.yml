name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      # The suite runs on in-memory SQLite against the deterministic fake LLM,
      # so it needs neither Postgres nor an API key.
      - name: Tests
        env:
          LLM_PROVIDER: fake
        run: uv run pytest -q

  migrations:
    name: Migrations (against Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiboc
          POSTGRES_PASSWORD: aiboc
          POSTGRES_DB: aiboc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiboc -d aiboc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Applying every migration in order on a real Postgres is what proves the
      # schema history is sound, not just the current models.
      - name: Upgrade to head
        env:
          DATABASE_URL: postgresql+psycopg://aiboc:aiboc@localhost:5432/aiboc
        run: uv run alembic upgrade head

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
